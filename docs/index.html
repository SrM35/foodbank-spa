<!DOCTYPE html>
<html lang="es">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Food bank</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link
    href="https://fonts.googleapis.com/css2?family=Poppins:ital,wght@0,100;0,200;0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,100;1,200;1,300;1,400;1,500;1,600;1,700;1,800;1,900&display=swap"
    rel="stylesheet">

  <!-- Carga prioritaria de los estilos del Shell -->
  <link rel="stylesheet" href="styles/shell.css" />
  <!-- Estilos del contenido dinámico -->
  <link rel="stylesheet" href="styles/main.css" />
  <!-- Iconos -->
  <link rel="stylesheet"
    href="https://fonts.googleapis.com/css2?family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200&icon_names=home,info,mail,error" />
</head>

<body>

  <!-- App Shell: Header y Navegación Fijos -->
  <header class="mobile-header">
    <button id="menu-btn" class="menu-btn">☰</button>
    <div class="logo">
      <img src="assets/imagen-removebg-preview.png" alt="Logo de Foodbank" />
    </div>
    <h1 class="mobile-title">Foodbank</h1>
  </header>

  <div class="layout-container">
    <aside class="sidebar" id="sidebar">
      <div class="sidebar-header">
        <div class="logo">
          <img src="assets/imagen-removebg-preview.png" alt="Logo de Foodbank" />
        </div>
        <div class="tittle">
          <h1>Foodbank</h1>
        </div>
      </div>
      <nav>
        <ul>
          <li><a href="/" data-link><span class="material-symbols-rounded">home</span>Inicio</a></li>
          <li><a href="/acerca" data-link><span class="material-symbols-rounded">info</span>Acerca de</a></li>
          <li><a href="/contacto" data-link><span class="material-symbols-rounded">mail</span>Contacto</a></li>
          <li><a href="/ruta-inexistente" data-link><span class="material-symbols-rounded">error</span>Ruta inválida</a>
          </li>
        </ul>
      </nav>
    </aside>
    <!-- App Shell Container: Inyección de Vistas -->
    <main id="app">
      <!-- Skeleton inicial: Se muestra mientras la primera vista resuelve sus recursos -->
      <div class="skeleton-card">
        <div class="skeleton skeleton-title"></div>
        <div class="skeleton skeleton-line"></div>
        <div class="skeleton skeleton-line"></div>
        <div class="skeleton skeleton-line short"></div>
      </div>
    </main>
  </div>
  <footer>
    <p>La URL cambia, pero el documento nunca se recarga. Observa la pestaña Network.</p>
  </footer>
  <!-- App Shell: Footer Fijo -->
  <script type="module" src="src/main.js"></script>
</body>

</html>
